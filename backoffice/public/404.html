<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#5F3E88" />
<title>Página no encontrada · ElderTech Backoffice</title>
<style>
  :root {
    --bg1: #f2eef8; --bg2: #ffffff; --ink: #2c1d44; --muted: #5b5170;
    --brand: #5f3e88; --brand-soft: #e7defa; --brand-ink: #ffffff; --card: #ffffff; --line: #e2d9ef; --code: #f6f2fb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg1: #140d20; --bg2: #1d1330; --ink: #f4effb; --muted: #c4bad6;
      --brand: #b9a5d6; --brand-soft: #3a2c57; --brand-ink: #1a1028; --card: #241a38; --line: #3a2c57; --code: #2d2145;
    }
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background: radial-gradient(1200px 600px at 50% -10%, var(--bg1), var(--bg2));
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  main {
    width: 100%; max-width: 560px; text-align: center; background: var(--card); border: 1px solid var(--line);
    border-radius: 24px; padding: 36px 28px 30px; box-shadow: 0 18px 50px -22px rgba(95, 62, 136, .4);
  }
  .cabecera { display: inline-flex; align-items: center; gap: 12px; }
  .cabecera img { width: 56px; height: 56px; object-fit: contain; background: #fff; border-radius: 14px; padding: 5px; border: 1px solid var(--line); }
  .cabecera span { font-size: 22px; font-weight: 800; color: var(--brand); }
  .cabecera small { display: block; font-size: 13px; font-weight: 600; color: var(--muted); text-align: left; }
  .codigo { font-size: clamp(84px, 20vw, 128px); line-height: 1; font-weight: 900; color: var(--brand); letter-spacing: -3px; margin: 22px 0 4px; }
  h1 { font-size: 26px; margin: 0 0 8px; font-weight: 800; }
  p { font-size: 17px; line-height: 1.55; color: var(--muted); margin: 0 auto; max-width: 30em; }
  ul { list-style: none; margin: 18px auto 0; padding: 0; max-width: 26em; text-align: left; display: grid; gap: 8px; color: var(--muted); font-size: 16px; }
  ul li { display: flex; gap: 10px; align-items: flex-start; }
  ul li::before { content: "›"; color: var(--brand); font-weight: 900; }
  .dir { display: none; margin: 18px auto 0; max-width: 100%; padding: 8px 12px; border-radius: 10px; background: var(--code); font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  .botones { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 24px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 24px; border-radius: 12px;
    font-size: 16px; font-weight: 700; text-decoration: none; cursor: pointer; border: 2px solid var(--brand); font-family: inherit;
  }
  .btn.primario { background: var(--brand); color: var(--brand-ink); }
  .btn.secundario { background: transparent; color: var(--brand); }
  .btn:focus-visible { outline: 4px solid var(--brand-soft); outline-offset: 3px; }
</style>
</head>
<body>
<main role="main">
  <div class="cabecera">
    <img src="/admin/logo.png" alt="" width="52" height="52" />
    <div><span>ElderTech</span><small>Backoffice</small></div>
  </div>

  <div class="codigo" aria-hidden="true">404</div>
  <h1>Página no encontrada</h1>
  <p>La dirección que abriste no existe o cambió de lugar.</p>

  <ul>
    <li>Volvé a la página anterior.</li>
    <li>Revisá que el enlace esté bien escrito.</li>
    <li>Si lo tenías guardado, puede estar desactualizado: entrá desde el inicio.</li>
  </ul>

  <div class="dir" id="dir"></div>

  <div class="botones">
    <button class="btn primario" type="button" onclick="if (history.length > 1) history.back(); else location.href = '/admin/';">Volver atrás</button>
    <a class="btn secundario" href="/admin/">Ir al inicio</a>
  </div>
</main>
<script>
  (function () {
    var el = document.getElementById('dir');
    el.textContent = location.pathname + location.search;
    el.style.display = 'block';
  })();
</script>
</body>
</html>
