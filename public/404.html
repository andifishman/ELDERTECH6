<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#5F3E88" />
<title>No pudimos abrir esta pantalla · ElderTech</title>
<style>
  :root {
    --bg1: #f2eef8; --bg2: #ffffff; --ink: #2c1d44; --muted: #5b5170;
    --brand: #5f3e88; --brand-soft: #e7defa; --brand-ink: #ffffff; --card: #ffffff; --line: #e2d9ef; --paso: #f6f2fb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg1: #140d20; --bg2: #1d1330; --ink: #f4effb; --muted: #c4bad6;
      --brand: #b9a5d6; --brand-soft: #3a2c57; --brand-ink: #1a1028; --card: #241a38; --line: #3a2c57; --paso: #2d2145;
    }
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background: radial-gradient(1200px 600px at 50% -10%, var(--bg1), var(--bg2));
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  main {
    width: 100%; max-width: 560px; text-align: center; background: var(--card); border: 1px solid var(--line);
    border-radius: 28px; padding: 34px 26px 28px; box-shadow: 0 18px 50px -22px rgba(95, 62, 136, .4);
  }
  .logo { width: 96px; height: 96px; border-radius: 24px; display: block; margin: 0 auto; box-shadow: 0 8px 22px -10px rgba(95, 62, 136, .6); }
  .marca { margin: 10px 0 0; font-size: 20px; font-weight: 800; color: var(--brand); letter-spacing: .2px; }
  .fecha { margin: 18px 0 0; font-size: 18px; color: var(--muted); min-height: 1.4em; }
  h1 { font-size: clamp(30px, 8vw, 40px); line-height: 1.15; margin: 4px 0 6px; font-weight: 800; }
  .sub { font-size: 21px; line-height: 1.45; color: var(--muted); margin: 0; }
  .pasos { list-style: none; padding: 0; margin: 24px 0 0; display: grid; gap: 12px; text-align: left; }
  .pasos li { display: flex; align-items: center; gap: 16px; background: var(--paso); border-radius: 18px; padding: 16px 18px; font-size: 22px; font-weight: 700; }
  .n { flex: none; width: 44px; height: 44px; border-radius: 50%; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; font-size: 22px; font-weight: 800; }
  .ayuda { margin: 20px 0 0; font-size: 18px; line-height: 1.45; color: var(--muted); }
  .botones { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 22px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; min-height: 60px; padding: 0 30px; border-radius: 18px;
    font-size: 21px; font-weight: 800; text-decoration: none; cursor: pointer; border: 3px solid var(--brand); font-family: inherit;
  }
  .btn.primario { background: var(--brand); color: var(--brand-ink); }
  .btn.secundario { background: transparent; color: var(--brand); }
  .btn:focus-visible { outline: 4px solid var(--brand-soft); outline-offset: 3px; }
  .cod { display: block; margin-top: 22px; font-size: 14px; color: var(--muted); opacity: .85; }
</style>
</head>
<body>
<main role="main">
  <img class="logo" src="/icons/icon-192.png" alt="ElderTech" width="96" height="96" />
  <p class="marca">ElderTech</p>

  <p class="fecha" id="fecha"></p>
  <h1 id="saludo">Hola</h1>
  <p class="sub">No pudimos abrir esta pantalla. Probá así:</p>

  <ol class="pasos">
    <li><span class="n">1</span><span>Cerrá la aplicación.</span></li>
    <li><span class="n">2</span><span>Volvé a abrirla.</span></li>
  </ol>

  <p class="ayuda">Si sigue pasando, avisale a quien te acompaña en la residencia.</p>

  <div class="botones">
    <a class="btn primario" href="/">Ir al inicio</a>
    <button class="btn secundario" type="button" onclick="if (history.length > 1) history.back(); else location.href = '/';">Volver atrás</button>
  </div>

  <span class="cod">Error 404 · pantalla no encontrada</span>
</main>
<script>
  (function () {
    var ahora = new Date();
    var h = ahora.getHours();
    document.getElementById('saludo').textContent = h < 6 ? 'Buenas noches' : h < 13 ? 'Buenos días' : h < 20 ? 'Buenas tardes' : 'Buenas noches';
    try {
      var f = ahora.toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric', month: 'long' });
      document.getElementById('fecha').textContent = f.charAt(0).toUpperCase() + f.slice(1);
    } catch (e) { /* sin fecha: queda vacío */ }
  })();
</script>
</body>
</html>
