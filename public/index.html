<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <!-- Plantilla HTML de la versión web/PWA (Expo la usa en lugar de la genérica porque existe public/index.html).
         Expo agrega solo: <meta name="theme-color">, <meta name="description"> (de app.json › web) y los <script> del bundle.
         viewport-fit=cover es lo que activa env(safe-area-inset-*) (notch / Dynamic Island / barra inferior).
         NO se bloquea el zoom (maximum-scale) a propósito: es accesibilidad. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />

    <!-- iOS / Safari: instalación en pantalla de inicio -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ElderTech" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- Splash de iOS: solo se muestra si la media query matchea EXACTO la resolución del iPhone.
         Se generan con tools/generar-pwa-assets.mjs (misma lista de resoluciones). -->
    <link rel="apple-touch-startup-image" href="/splash/iphone-320x568@2x.png" media="(device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/iphone-375x667@2x.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/iphone-414x736@3x.png" media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/iphone-375x812@3x.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/iphone-414x896@2x.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/iphone-414x896@3x.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/iphone-390x844@3x.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/iphone-428x926@3x.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/iphone-393x852@3x.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/iphone-430x932@3x.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/iphone-402x874@3x.png" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/iphone-440x956@3x.png" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />

    <style id="expo-reset">
      :root { --app-height: 100dvh; --app-top: 0px; color-scheme: light; }
      html, body { height: 100%; }
      html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; background-color: #1B5E3B; }
      body { margin: 0; overflow: hidden; background-color: #123F28; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
      /* #root fijo y del alto del viewport VISIBLE: evita el "rebote" de la página entera en iOS
         y hace que el teclado virtual achique la pantalla en vez de taparla (ver script de abajo). */
      #root { position: fixed; left: 0; right: 0; top: var(--app-top); height: var(--app-height); display: flex; overflow: hidden; }
      /* Sin zoom por doble toque en botones (el zoom por pellizco sigue disponible — accesibilidad). */
      a, button, [role="button"] { touch-action: manipulation; }
      /* Foco visible al navegar con teclado (accesibilidad en escritorio). */
      :focus-visible { outline: 3px solid #1565C0; outline-offset: 2px; }
      @media (prefers-reduced-motion: reduce) { * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }
    </style>
    <script>
      // Mantiene --app-height / --app-top iguales al viewport VISIBLE. En iOS Safari, cuando aparece el
      // teclado virtual el layout viewport no se achica (solo el visual viewport), y un input al pie de
      // la pantalla (chat) quedaría tapado por el teclado.
      (function () {
        var root = document.documentElement;
        function actualizar() {
          var vv = window.visualViewport;
          root.style.setProperty('--app-height', (vv ? vv.height : window.innerHeight) + 'px');
          root.style.setProperty('--app-top', (vv ? vv.offsetTop : 0) + 'px');
        }
        actualizar();
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', actualizar);
          window.visualViewport.addEventListener('scroll', actualizar);
        }
        window.addEventListener('resize', actualizar);
        window.addEventListener('orientationchange', actualizar);
      })();
    </script>
  </head>

  <body>
    <noscript>ElderTech necesita JavaScript activado para funcionar.</noscript>
    <div id="root"></div>
  </body>
</html>
