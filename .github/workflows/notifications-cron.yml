name: Procesar notificaciones pendientes

# El cron de Vercel (plan gratuito) solo corre una vez por día — para que las
# notificaciones programadas, los recordatorios de actividades y los
# recordatorios de Agenda (1 hora antes del evento, sin excepción) disparen
# con precisión de minutos, este workflow llama a ambos endpoints cada 5
# minutos. Requiere dos secrets configurados en Settings → Secrets and
# variables → Actions del repo: BACKEND_URL (ej.
# https://backend-beta-flax-82.vercel.app) y CRON_SECRET (el mismo valor que
# está configurado en las env vars de Vercel).

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar al procesador de notificaciones
        run: |
          curl -sf -X POST "${{ secrets.BACKEND_URL }}/api/internal/notifications/process" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
      - name: Llamar al procesador de Agenda (recordatorio 1 hora antes)
        run: |
          curl -sf -X POST "${{ secrets.BACKEND_URL }}/api/internal/agenda/process" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
